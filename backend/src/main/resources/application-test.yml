spring:
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: jdbc:postgresql://localhost:5432/campusflow_test
    username: ${DB_USER:campusflow}
    password: ${DB_PASSWORD:devpass}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: false
    clean-on-validation-error: true
    validate-on-migrate: false

app:
  agent:
    mode: scripted

agent:
  executor:
    async: false
  rate-limit:
    per-minute: 1000  # Effectively disabled during tests

LLM_API_KEY: ""
LLM_PROVIDER: offline
