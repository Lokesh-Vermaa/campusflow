spring:
  application:
    name: campusflow-backend
  profiles:
    default: dev
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/campusflow}
    username: ${DB_USER:campusflow}
    password: ${DB_PASSWORD:devpass}
    driver-class-name: org.postgresql.Driver
  jackson:
    time-zone: Asia/Kolkata
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
        generate_statistics: true
  flyway:
    enabled: true
    clean-disabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
  servlet:
    context-path: /
    session:
      timeout: 30m
      cookie:
        name: JSESSIONID
        http-only: true
        same-site: lax

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

app:
  agent:
    mode: ${APP_AGENT_MODE:scripted}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  demo-password: ${DEMO_USER_PASSWORD:}
